<!DOCTYPE html>

<html>
<head>
    <meta charset = "UTF-8">
    <link rel = "stylesheet" href = "style.css">
    <title>Speedcraft</title>
</head>
<body>
    <div id="grid">
        <button data-x="0" data-y="0"><img></button>
        <button data-x="1" data-y="0"><img></button>
        <button data-x="2" data-y="0"><img></button>
        <button data-x="0" data-y="1"><img></button>
        <button data-x="1" data-y="1"><img></button>
        <button data-x="2" data-y="1"><img></button>
        <button data-x="0" data-y="2"><img></button>
        <button data-x="1" data-y="2"><img></button>
        <button data-x="2" data-y="2"><img></button>
    </div>
    <div id="materials">
        <button data-material="oak_log">Log</button>
        <button data-material="oak_planks">Plank</button>
        <button data-material="stick">Stick</button>
    </div>
    <button id="clear">Clear Grid</button>
    <script type = "module" src = "src/main.js"></script>
</body>
</html>
